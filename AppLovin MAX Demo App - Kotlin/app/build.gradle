apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'kotlin-kapt' // room-compiler

def isLocalAppLovinWorkspace = rootProject.name == "Android-Workspace"

android {
    namespace "com.applovin.enterprise.apps.demoapp"
    compileSdk 36
    defaultConfig {
        applicationId "com.nps.adiscope.sampleapp"
        minSdkVersion 24
        targetSdk 36
        versionCode 10000
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    buildFeatures {
        compose true
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    if (isLocalAppLovinWorkspace) {
        flavorDimensions "default"
        productFlavors {
            // There is only one flavor for running SDK in
            app {
                matchingFallbacks = ['app', 'standalone']
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    def room_version = "2.5.1"

    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    kapt "org.xerial:sqlite-jdbc:3.34.0"
    // optional - Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:$room_version"

    androidTestImplementation "androidx.room:room-testing:2.5.1"
    implementation 'androidx.multidex:multidex:2.0.1'

    /*network module*/
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.2.1'

    implementation "androidx.fragment:fragment-ktx:1.4.0"
    implementation 'androidx.navigation:navigation-fragment-ktx:2.3.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.5'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.json:json:20231013'

    /* 데모 앱 소스 컴파일용 (데모 원래 의존성) */
    implementation 'com.adjust.sdk:adjust-android:4.28.7'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'androidx.compose.runtime:runtime:1.1.0'
    implementation 'androidx.activity:activity-compose:1.3.0'
    implementation 'androidx.compose.material:material:1.3.0'
    implementation 'androidx.compose.foundation:foundation:1.3.0'

    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation("com.google.firebase:firebase-crashlytics")

    /* adiscope 모듈에서 사용하는 외부 의존성 */
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    /* adiscope max 모듈 의존성 */
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'
    implementation 'com.applovin:applovin-sdk:13.6.4'
    implementation 'com.applovin.mediation:inmobi-adapter:11.5.0.0'
    implementation 'com.applovin.mediation:bidmachine-adapter:3.6.1.0'
    implementation 'com.applovin.mediation:ogury-presage-adapter:6.2.2.0'
    implementation 'com.applovin.mediation:google-ad-manager-adapter:25.2.0.0'
    implementation 'com.applovin.mediation:fyber-adapter:8.4.7.0'
    implementation 'com.applovin.mediation:moloco-adapter:4.8.0.0'
    implementation 'com.applovin.mediation:chartboost-adapter:9.14.0.0'
    implementation 'com.google.android.gms:play-services-base:16.1.0'
    implementation 'com.applovin.mediation:ironsource-adapter:9.6.0.0.0'
    implementation 'com.applovin.mediation:bigoads-adapter:5.8.2.0'
    implementation 'com.applovin.mediation:line-adapter:3000.0.1.0'
    implementation 'com.applovin.mediation:pubmatic-adapter:4.11.0.0'
    implementation 'com.applovin.mediation:verve-adapter:3.8.1.0'
}
